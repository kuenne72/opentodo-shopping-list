[project]
name = "einkauf"
version = "0.1.0"
description = "Shopping list companion for OpenTodo / Einkaufsliste als Ergänzung zu OpenTodo"
readme = "README.md"
license = { text = "MIT" }
keywords = ["opentodo", "shopping-list", "einkaufsliste", "self-hosted", "pwa"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.12"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
einkauf = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/kuenne72/opentodo-shopping-list"
Issues = "https://github.com/kuenne72/opentodo-shopping-list/issues"
